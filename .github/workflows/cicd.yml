name: Deploy Node Application

on:
  push:
    branches:
      - backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
      - name: Build Docker Image
        run: docker build -t riteshhedau/assignment-server .
      - name: Publish Image to docker hub
        run: docker push riteshhedau/assignment-server:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull image from docker hub
        run: docker pull riteshhedau/assignment-server:latest
      - name: Delete old container
        run: docker rm -f assignment-server-container
      - name: Run Docker container
        run: |
        docker run -d \
          --name assignment-server-container \
          --add-host=host.docker.internal:host-gateway \
          -p 4000:4000 \
          -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
          -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
          -e DB_NAME=${{ secrets.DB_NAME }} \
          -e DB_HOST=host.docker.internal \
          riteshhedau/assignment-server:latest
